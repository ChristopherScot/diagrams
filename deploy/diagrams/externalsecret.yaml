apiVersion: v1
kind: ServiceAccount
metadata:
  name: diagrams
  namespace: diagrams
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-diagrams
  namespace: diagrams
spec:
  provider:
    vault:
      server: http://vault.default.svc.cluster.local:8200
      path: kv
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: diagrams
          serviceAccountRef:
            name: diagrams
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: diagrams-secrets
  namespace: diagrams
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-diagrams
    kind: SecretStore
  target:
    name: diagrams-secrets
  data:
    - secretKey: S3_ACCESS_KEY_ID
      remoteRef: { key: diagrams/s3, property: access-key-id }
    - secretKey: S3_SECRET_ACCESS_KEY
      remoteRef: { key: diagrams/s3, property: secret-access-key }
