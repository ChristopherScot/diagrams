apiVersion: v1
kind: Service
metadata:
  name: keda-http-interceptor
  namespace: diagrams
spec:
  type: ExternalName
  externalName: keda-add-ons-http-interceptor-proxy.keda.svc.cluster.local
---
apiVersion: http.keda.sh/v1beta1
kind: InterceptorRoute
metadata:
  name: diagrams
  namespace: diagrams
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  target:
    service: diagrams
    port: 80
  rules:
    - hosts:
        - diagrams.home.chrisscotmartin.com
      paths:
        - value: /
  scalingMetric:
    requestRate:
      targetValue: 100
  timeouts:
    readiness: 60s
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: diagrams
  namespace: diagrams
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: diagrams
  minReplicaCount: 0
  maxReplicaCount: 1
  cooldownPeriod: 900
  triggers:
    - type: external-push
      metadata:
        scalerAddress: keda-add-ons-http-external-scaler.keda:9090
        interceptorRoute: diagrams
