apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: diagrams
  namespace: diagrams
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: external
  tls:
    - hosts: [diagrams.home.chrisscotmartin.com]
      secretName: diagrams-tls
  rules:
    - host: diagrams.home.chrisscotmartin.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                # KEDA HTTP interceptor (scale-to-zero), not the app's own
                # Service - see scale-to-zero.yaml. 8080 is the
                # interceptor's port; the diagrams Service still serves 80.
                name: keda-http-interceptor
                port:
                  number: 8080
